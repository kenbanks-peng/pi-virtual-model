# pi-virtual-model configuration
#
# Pi deploys this file to:
#   $PI_CODING_AGENT_DIR/extensions/pi-virtual-model/config.toml
# or, when PI_CODING_AGENT_DIR is not set:
#   ~/.pi/agent/extensions/pi-virtual-model/config.toml

[virtual_model]
provider = "openai-codex"
id = "auto"
name = "Auto"
# This controls reasoning effort, not model selection.
thinking_levels = ["low", "medium", "high", "xhigh"]

[routing]
# Start each user message with this model. It plans and makes the first edit.
planning_model = "gpt-6-astra"
# After a successful edit or write, use this model for the rest of the turn.
implementation_model = "gpt-6-luna"
# Requests outside the agent loop, such as compaction summaries.
direct_model = "gpt-6-luna"
direct_thinking_level = "medium"
